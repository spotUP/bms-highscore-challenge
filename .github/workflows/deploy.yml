name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

# The host serves several sites; never let two deploys work on it at once.
concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/retroranks

jobs:
  # The image is built here, not on the host. Building on the host ran it out
  # of memory and took every site on that machine down with it.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_WS_URL=${{ vars.VITE_WS_URL }}
            VITE_MEDIA_BASE_URL=${{ vars.VITE_MEDIA_BASE_URL }}
            VITE_CLOUDFLARE_R2_DOMAIN=${{ vars.VITE_CLOUDFLARE_R2_DOMAIN }}
            VITE_RAWG_API_KEY=${{ secrets.VITE_RAWG_API_KEY }}
            VITE_IGDB_CLIENT_ID=${{ secrets.VITE_IGDB_CLIENT_ID }}
            VITE_IGDB_ACCESS_TOKEN=${{ secrets.VITE_IGDB_ACCESS_TOKEN }}

      - name: Refuse to deploy a frontend built without its public URLs
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ] || [ -z "${{ vars.VITE_WS_URL }}" ]; then
            echo "VITE_API_URL and VITE_WS_URL must be set as repository variables."
            echo "Without them the frontend ships with empty URLs and realtime silently dies."
            exit 1
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Lowercase image name
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository_owner }}/retroranks' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          envs: IMAGE_REF,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /app/retroranks

            AVAILABLE_MB=$(df -Pm / | awk 'NR==2 {print $4}')
            if [ "$AVAILABLE_MB" -lt 3000 ]; then
              echo "Only ${AVAILABLE_MB}MB free on /. Reclaiming space before deploying."
              docker builder prune -af
              docker image prune -af
              AVAILABLE_MB=$(df -Pm / | awk 'NR==2 {print $4}')
              echo "${AVAILABLE_MB}MB free after pruning."
            fi

            git pull origin main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            APP_IMAGE="$IMAGE_REF" docker compose pull app
            APP_IMAGE="$IMAGE_REF" docker compose up -d --no-build
            docker logout ghcr.io

            echo "Running migrations..."
            for f in db/migrations/*.sql; do
              echo "Applying $f"
              docker compose exec -T db psql -U retroranks -d retroranks -v ON_ERROR_STOP=1 -f /dev/stdin < "$f"
            done
            echo "Migrations complete"

            docker image prune -f
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
