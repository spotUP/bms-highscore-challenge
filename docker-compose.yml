services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: retroranks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: retroranks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retroranks"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    # Built and pushed by CI; the host only pulls. Building here starved the
    # machine of memory and took every site on it down.
    image: ${APP_IMAGE:-ghcr.io/spotup/retroranks:latest}
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_MEDIA_BASE_URL: ${VITE_MEDIA_BASE_URL}
        VITE_CLOUDFLARE_R2_DOMAIN: ${VITE_CLOUDFLARE_R2_DOMAIN}
        VITE_RAWG_API_KEY: ${VITE_RAWG_API_KEY}
        VITE_IGDB_CLIENT_ID: ${VITE_IGDB_CLIENT_ID}
        VITE_IGDB_ACCESS_TOKEN: ${VITE_IGDB_ACCESS_TOKEN}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgres://retroranks:${POSTGRES_PASSWORD}@db:5432/retroranks
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3002"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://retroranks.uprough.net}
      CLOUDFLARE_R2_DOMAIN: ${VITE_CLOUDFLARE_R2_DOMAIN}
    healthcheck:
      # The runtime image has node but no curl, and localhost resolves to ::1
      # first, which nothing listens on.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
